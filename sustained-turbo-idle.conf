# Idle-mode override (deep-idle.sh) — full stop is fine here: sweep test
# showed pwm=0/5 gives a clean, stable 0 RPM (unlike the 10-30 range,
# which stalls/restarts erratically). Higher curve points untouched, so
# if temp/power actually climbs while idle, the fan still responds
# normally — only the low-end floor drops to true 0.
MODE="${MODE:-auto}"
REARM_INTERVAL="${REARM_INTERVAL:-90}"
LOAD_THRESHOLD="${LOAD_THRESHOLD:-70}"
LOAD_SUSTAIN="${LOAD_SUSTAIN:-60}"
LOAD_RELEASE="${LOAD_RELEASE:-45}"
POLL="${POLL:-4}"
TEMP_W="${TEMP_W:-1.0}"
LOAD_W="${LOAD_W:-0}"
TEMP_FLOOR_C="${TEMP_FLOOR_C:-60}"
TEMP_CEIL_C="${TEMP_CEIL_C:-95}"
PWM_FLOOR="${PWM_FLOOR:-0}"
PWM_CEIL="${PWM_CEIL:-255}"
CURVE_POINTS="${CURVE_POINTS:-60:0 70:110 80:150 88:190 92:225 95:255}"
POWER_CURVE_POINTS="${POWER_CURVE_POINTS:-25:0 40:60 70:130 110:200 140:255}"
HIGH_POWER_W="${HIGH_POWER_W:-70}"
HIGH_POWER_HOLD_S="${HIGH_POWER_HOLD_S:-900}"
