# Налаштування sustained-turbo.
# Після зміни: rc-service sustained-turbo restart

# auto   — вмикається сам на тривалому навантаженні, гасне в простої (типово)
# always — переармовує постійно (78-80C, гучніші вентилятори)
# off    — вимкнено
MODE="${MODE:-auto}"
FIXED_PWM="${FIXED_PWM:-45}"

# як часто переармовувати, поки активний. EC знімає турбо приблизно на 130-150с,
# тому 90 дає запас.
REARM_INTERVAL="${REARM_INTERVAL:-90}"

# --- параметри режиму auto ---
# завантаження всіх ядер у %, вище якого рахуємо навантаження «важким»
LOAD_THRESHOLD="${LOAD_THRESHOLD:-70}"
# скільки секунд поспіль треба бути вище порогу, щоб увімкнутись
LOAD_SUSTAIN="${LOAD_SUSTAIN:-60}"
# скільки секунд нижче порогу, щоб відпустити
LOAD_RELEASE="${LOAD_RELEASE:-45}"
# період семплювання. Опущено з 10 до 4с (2026-09-19): живий сампл раз на
# 1с показав pwm1/RPM, що провалюються до ~13/200-300 RPM МІЖ нашими
# записами (жоден інший процес pwm1 не пише — лише сам демон) — схоже на
# квіркову поведінку EC цієї плати (8C99, "Unknown EC layout") в проміжках
# між setpoint'ами. Частіші перезаписи "перебивають" ці провали швидше.
POLL="${POLL:-4}"

# --- крива вентиляторів: temp + прискорення по load (2026-08-01, виправлено) ---
# pwm = PWM_FLOOR + score*(PWM_CEIL-PWM_FLOOR), де
# score = min(1, TEMP_W*temp_norm + LOAD_W*load_norm)
# temp_norm: 0 при TEMP_FLOOR_C, 1 при TEMP_CEIL_C (clamp)
# load_norm: 0 при 0% завантаження, 1 при 100%
# ВАЖЛИВО: це НЕ середнє (ділення на TEMP_W+LOAD_W) — перша версія ділила,
# і при реальній грі (temp 90-94C стійко, load лише ~21%, бо завантажені
# 2-3 з 24 потоків) pwm тримався ~171 замість стелі — занадто слабко.
# TEMP_W=1.0 гарантує: temp сама по собі завжди може дотягнутись до стелі,
# незалежно від load. LOAD_W лише ДОДАЄ прискорення (раніше дожене стелю
# при високому load ще до того як temp сама туди підніметься).
TEMP_W="${TEMP_W:-1.0}"
LOAD_W="${LOAD_W:-0.4}"
TEMP_FLOOR_C="${TEMP_FLOOR_C:-60}"
TEMP_CEIL_C="${TEMP_CEIL_C:-95}"
# межі pwm. Свіп показав 40 -> ~800 RPM як останнє стабільне монотонне
# значення (нижче 35 — глохне ривками). PWM_FLOOR=45 (~900 RPM) — з
# невеликим запасом над цією межею.
# 2026-09-19: провали до 200-300 RPM між записами демона виявились багом
# РЕЖИМУ auto (перемикання fan_take_control/release і/або гістерезис
# створювали вікна нестабільності), не проблемою самого floor=45 — під
# always (MODE вище) той самий floor тримається рівно без жодних провалів
# (перевірено: 8 семплів по 1с, 0 відхилень). Тому floor знову 45.
PWM_FLOOR="${PWM_FLOOR:-45}"
PWM_CEIL="${PWM_CEIL:-255}"
# Крива вентиляторів: точки "temp:pwm" за зростанням температури.
# Між точками — лінійна інтерполяція (кусково-лінійна крива, не пряма).
# Перша точка узгоджена з PWM_FLOOR (45) — інакше сама крива тримала б
# своє старе значення на холостому ході незалежно від floor.
CURVE_POINTS="${CURVE_POINTS:-60:45 70:110 80:150 88:190 92:225 95:255}"

# --- сумарна ватність (CPU package RAPL + GPU nvidia-smi), Вт (2026-09-19) ---
# На відміну від LOAD_W (лише додає зверху, ніколи не послаблює temp-криву),
# ватність — ПОВНОЦІННА крива нарівні з temp: фінальний pwm = max(temp+load,
# power-крива). Це дає їй змогу і піднімати оберти незалежно від того, чи
# встигла піднятись temp (ватність реагує миттєво, temp — із затримкою),
# і ОПУСКАТИ їх при малому споживанні — те, чого адитивна добавка не могла.
# POWER_CURVE_POINTS "ватт:pwm": 40W -> pwm60 (=1200 RPM, заміряно) — задана
# точка; решта продовжує ту саму форму до PWM_CEIL при 140W (CPU~21W idle +
# GPU enforced.power.limit=110W).
POWER_CURVE_POINTS="${POWER_CURVE_POINTS:-25:45 40:60 70:130 110:200 140:255}"
# Гістерезис: якщо було >=HIGH_POWER_W (Вт) протягом останніх
# HIGH_POWER_HOLD_S секунд — power-компонент тримається на останньому
# високому значенні й НЕ опускається, навіть якщо споживання щойно впало.
# Опускається лише після HIGH_POWER_HOLD_S спокою нижче порога — це і є
# захист від різких стрибків туди-сюди при короткочасних просіданнях.
HIGH_POWER_W="${HIGH_POWER_W:-70}"
HIGH_POWER_HOLD_S="${HIGH_POWER_HOLD_S:-900}"
